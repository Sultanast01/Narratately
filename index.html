<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Narrately">
<title>Narrately — Any document, read aloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --surface: #faf8f4; --surface2: #f1ede6; --text: #262220;
    --muted: #8a8279; --accent: #dc9a3c; --accent-deep: #b97b23; --accent2: #5f9c82; --border: #ece7de;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    padding: max(18px, env(safe-area-inset-top)) 18px 0;
    max-width: 680px; margin: 0 auto; line-height: 1.5;
    padding-bottom: max(18px, env(safe-area-inset-bottom));
  }
  .wordmark { font-family: 'Fraunces', serif; font-weight: 600; font-size: 28px; letter-spacing: -0.01em; }
  .tag { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-end; padding: 6px 0 22px; }
  .addBtn {
    background: var(--accent); color: #1a1408; border: none; font-weight: 700;
    font-size: 14px; padding: 10px 18px; border-radius: 100px; cursor: pointer;
  }
  input[type=file] { display: none; }
  #status { font-size: 13px; color: var(--muted); min-height: 18px; margin: 4px 0 10px; }
  #capNote { font-size: 12px; color: var(--muted); margin-bottom: 14px; }

  .sectionLabel { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; margin: 4px 0 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 18px 16px; padding-bottom: 20px; }
  .tile { cursor: pointer; }
  .cover {
    aspect-ratio: 2/3; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-size: 34px; font-weight: 600; color: rgba(0,0,0,0.55);
    position: relative; overflow: hidden; margin-bottom: 8px;
    box-shadow: 0 10px 24px -12px rgba(120,90,30,0.4);
  }
  .cover .bar { position: absolute; bottom: 0; left: 0; height: 4px; background: rgba(0,0,0,0.35); }
  .tileTitle { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .tileMeta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .delX {
    position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%;
    background: rgba(0,0,0,0.4); color: #fff; border: none; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .emptyMsg { color: var(--muted); font-size: 14px; padding: 30px 0; text-align: center; }

  /* Player */
  #playerView { display: none; }
  .backRow { display: flex; align-items: center; gap: 10px; padding: 4px 0 20px; color: var(--muted); font-size: 14px; cursor: pointer; }
  .bigCover {
    aspect-ratio: 2/3; max-width: 220px; margin: 10px auto 22px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-size: 70px; font-weight: 600; color: rgba(0,0,0,0.5);
    box-shadow: 0 16px 34px -16px rgba(180,130,40,0.35);
  }
  .nowTitle { text-align: center; font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .nowMeta { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  #chunkText {
    font-size: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px; min-height: 90px; margin-bottom: 18px; white-space: pre-wrap;
  }
  .scrubRow input[type=range] {
    -webkit-appearance: none; width: 100%; height: 4px; border-radius: 4px;
    background: linear-gradient(to right, var(--accent) var(--pct, 0%), var(--border) var(--pct, 0%));
    margin: 0;
  }
  .scrubRow input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--text); cursor: pointer;
  }
  .scrubLabels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }

  .transport { display: flex; align-items: center; justify-content: center; gap: 26px; margin: 26px 0 8px; }
  .skipBtn { background: none; border: none; color: var(--text); font-size: 26px; cursor: pointer; padding: 6px; }
  .playCircle {
    width: 64px; height: 64px; border-radius: 50%; background: var(--accent); border: none;
    font-size: 24px; color: #1a1408; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 22px -8px rgba(180,130,40,0.5);
  }
  .stopLink { display: block; text-align: center; color: var(--muted); font-size: 13px; background: none; border: none; cursor: pointer; margin: 6px auto 26px; }

  details.settings { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px 16px; margin-bottom: 30px; }
  details.settings summary { padding: 12px 0; font-size: 13px; color: var(--muted); cursor: pointer; }
  details.settings[open] summary { color: var(--text); }
  .settingsBody { padding-bottom: 14px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 6px; }
  select, .rateRow input[type=range] {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 14px;
  }
  .checkRow { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .speedval { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  #voiceHint { font-size: 11px; color: var(--muted); margin-top: 8px; }

  /* Paywall modal */
  #paywallOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
  .paywallCard { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; max-width: 380px; width: 100%; }
  .paywallCard h3 { font-family: 'Fraunces', serif; font-size: 19px; margin: 0 0 8px; }
  .paywallCard p { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .paywallCard input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); margin-bottom: 12px; font-size: 14px; }
  .payBtn { width: 100%; padding: 12px; border-radius: 100px; border: none; background: var(--accent); color: #1a1408; font-weight: 700; font-size: 14px; cursor: pointer; margin-bottom: 8px; }
  .laterBtn { width: 100%; padding: 10px; border-radius: 100px; border: none; background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="wordmark">Narrately</div>
    <div class="tag">Any document, read aloud.</div>
  </div>
  <label class="addBtn" for="fileInput">+ Add book</label>
  <input type="file" id="fileInput" accept=".pdf,.docx,.txt">
</div>

<div id="libraryView">
  <div id="status"></div>
  <div id="capNote"></div>
  <div class="sectionLabel">Your Library</div>
  <div class="grid" id="libraryGrid"></div>
</div>

<div id="playerView">
  <div class="backRow" id="backBtn">‹ Library</div>
  <div class="bigCover" id="bigCover"></div>
  <div class="nowTitle" id="nowTitle"></div>
  <div class="nowMeta" id="nowMeta"></div>
  <div id="chunkText"></div>

  <div class="scrubRow">
    <input type="range" id="scrub" min="0" max="100" value="0">
    <div class="scrubLabels"><span id="scrubPos"></span><span id="scrubTotal"></span></div>
  </div>

  <div class="transport">
    <button class="skipBtn" id="prevBtn">⏮</button>
    <button class="playCircle" id="playBtn">▶</button>
    <button class="skipBtn" id="nextBtn">⏭</button>
  </div>
  <button class="stopLink" id="stopBtn">Stop</button>

  <details class="settings">
    <summary>Voice & speed</summary>
    <div class="settingsBody">
      <label for="voiceSelect">Voice</label>
      <select id="voiceSelect"></select>
      <div class="checkRow"><input type="checkbox" id="allLangs" style="width:auto;"> Show all languages</div>
      <div id="voiceHint"></div>
      <label for="rate">Reading speed</label>
      <div class="rateRow"><input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"></div>
      <div class="speedval"><span>0.5x</span><span id="rateVal">1.0x</span><span>2x</span></div>
    </div>
  </details>
</div>

<div id="paywallOverlay">
  <div class="paywallCard">
    <h3>You've hit the free limit</h3>
    <p>You've added <span id="paywallLimitNum">3</span> free books. Unlock unlimited books for ₦2,000 (one-time, on this device).</p>
    <label for="paywallEmail" style="margin-top:0;">Your email (for receipt)</label>
    <input type="email" id="paywallEmail" placeholder="you@example.com">
    <button class="payBtn" id="payBtn">Pay ₦2,000 to unlock</button>
    <button class="laterBtn" id="paywallCloseBtn">Maybe later</button>
  </div>
</div>

<!-- pdf.js for PDF text extraction -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- mammoth.js for DOCX text extraction -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<!-- Paystack for the ₦2,000 unlock payment. Sign up free at paystack.com to get your key. -->
<script src="https://js.paystack.co/v1/inline.js"></script>

<script>
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

const statusEl = document.getElementById('status');
const chunkTextEl = document.getElementById('chunkText');
const voiceSelect = document.getElementById('voiceSelect');
const rateInput = document.getElementById('rate');
const rateVal = document.getElementById('rateVal');
const playBtn = document.getElementById('playBtn');
const stopBtn = document.getElementById('stopBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const scrub = document.getElementById('scrub');

let chunks = [];
let idx = 0;
let isPlaying = false;
let currentBookId = '';

function safeStorage(fn, fallback) {
  try { return fn(); } catch (e) { return fallback; }
}

// ---- PAYWALL ----
const PAYWALL_ENABLED = false; // flip to true once you're ready to start charging
const PAYSTACK_PUBLIC_KEY = "pk_test_REPLACE_ME";
const PRICE_NGN = 2000;
const FREE_BOOK_LIMIT = 3;

function isPro() {
  return safeStorage(() => localStorage.getItem('narrately_pro') === 'true', false);
}
function setPro() {
  safeStorage(() => localStorage.setItem('narrately_pro', 'true'), null);
}
function showPaywall() {
  document.getElementById('paywallLimitNum').textContent = FREE_BOOK_LIMIT;
  document.getElementById('paywallOverlay').style.display = 'flex';
}
function hidePaywall() {
  document.getElementById('paywallOverlay').style.display = 'none';
}
document.getElementById('paywallCloseBtn').addEventListener('click', hidePaywall);
document.getElementById('payBtn').addEventListener('click', () => {
  const email = document.getElementById('paywallEmail').value.trim();
  if (!email || !email.includes('@')) { alert('Please enter a valid email first.'); return; }
  if (!window.PaystackPop || PAYSTACK_PUBLIC_KEY.includes('REPLACE_ME')) {
    alert('Payment isn\'t set up yet — add your real Paystack public key in the code (search PAYSTACK_PUBLIC_KEY).');
    return;
  }
  const handler = PaystackPop.setup({
    key: PAYSTACK_PUBLIC_KEY, email: email, amount: PRICE_NGN * 100, currency: 'NGN',
    callback: function () {
      setPro(); hidePaywall();
      statusEl.textContent = 'Payment successful — unlimited books unlocked!';
      renderLibrary();
    },
    onClose: function () {}
  });
  handler.openIframe();
});

// ---- COVER ART (generated, deterministic per title) ----
const COVER_PALETTES = [
  ['#e8b34f', '#b9822c'], ['#6fa88f', '#3d6b58'], ['#c9714f', '#8f4a30'],
  ['#7a8fc9', '#45568f'], ['#c95f7e', '#8f3a52'], ['#8fb350', '#5a7a2e']
];
function coverStyle(title) {
  let h = 0;
  for (let i = 0; i < title.length; i++) h = title.charCodeAt(i) + ((h << 5) - h);
  const [c1, c2] = COVER_PALETTES[Math.abs(h) % COVER_PALETTES.length];
  return `background: linear-gradient(145deg, ${c1}, ${c2});`;
}

// ---- LIBRARY STORAGE ----
function getLibrary() {
  return safeStorage(() => JSON.parse(localStorage.getItem('audiobook_library') || '{}'), {});
}
function saveLibrary(lib) {
  return safeStorage(() => { localStorage.setItem('audiobook_library', JSON.stringify(lib)); return true; }, false);
}

function updateCapNote() {
  const lib = getLibrary();
  const count = Object.keys(lib).length;
  const noteEl = document.getElementById('capNote');
  if (!PAYWALL_ENABLED) { noteEl.textContent = `${count} book${count === 1 ? '' : 's'} in your library.`; return; }
  if (isPro()) { noteEl.textContent = '⭐ Pro — unlimited books.'; return; }
  noteEl.textContent = `Free plan: ${count} of ${FREE_BOOK_LIMIT} books used.` +
    (count >= FREE_BOOK_LIMIT ? ' Tap + Add to upgrade.' : '');
}

function renderLibrary() {
  updateCapNote();
  const lib = getLibrary();
  const ids = Object.keys(lib).sort((a, b) => (lib[b].addedAt || 0) - (lib[a].addedAt || 0));
  const grid = document.getElementById('libraryGrid');
  if (!ids.length) {
    grid.innerHTML = '<div class="emptyMsg">No books yet — tap + Add book to get started.</div>';
    return;
  }
  grid.innerHTML = '';
  ids.forEach(id => {
    const b = lib[id];
    const pct = b.chunks.length ? Math.round(((b.idx || 0) / b.chunks.length) * 100) : 0;
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.innerHTML = `
      <div class="cover" style="${coverStyle(b.title)}">
        ${b.title.charAt(0).toUpperCase()}
        <button class="delX" data-id="${id}">✕</button>
        <div class="bar" style="width:${pct}%"></div>
      </div>
      <div class="tileTitle">${b.title}</div>
      <div class="tileMeta">${pct}% listened</div>`;
    tile.querySelector('.cover').addEventListener('click', (e) => {
      if (e.target.classList.contains('delX')) return;
      openBook(id);
    });
    tile.querySelector('.delX').addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm(`Remove "${b.title}" from your library?`)) {
        const lib2 = getLibrary(); delete lib2[id]; saveLibrary(lib2); renderLibrary();
      }
    });
    grid.appendChild(tile);
  });
}

function openBook(id) {
  const lib = getLibrary();
  const b = lib[id];
  if (!b) return;
  currentBookId = id;
  chunks = b.chunks;
  idx = b.idx || 0;
  document.getElementById('libraryView').style.display = 'none';
  document.getElementById('playerView').style.display = 'block';
  document.getElementById('bigCover').style.cssText += coverStyle(b.title);
  document.getElementById('bigCover').textContent = b.title.charAt(0).toUpperCase();
  document.getElementById('nowTitle').textContent = b.title;
  isPlaying = false;
  speechSynthesis.cancel();
  playBtn.textContent = '▶';
  showChunk();
}

document.getElementById('backBtn').addEventListener('click', () => {
  isPlaying = false;
  speechSynthesis.cancel();
  document.getElementById('playerView').style.display = 'none';
  document.getElementById('libraryView').style.display = 'block';
  renderLibrary();
});

// ---- EXTRACTION ----
async function extractPdf(file) {
  const buf = await file.arrayBuffer();
  const doc = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let i = 1; i <= doc.numPages; i++) {
    statusEl.textContent = `Reading page ${i} of ${doc.numPages}...`;
    const page = await doc.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(' ') + '\n';
  }
  return text;
}
async function extractDocx(file) {
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer: buf });
  return result.value;
}
async function extractTxt(file) { return await file.text(); }
function cleanText(text) { return text.replace(/-\n(?=\w)/g, '').replace(/\s+/g, ' ').trim(); }
function chunkText(text, maxChars = 240) {
  const sentences = text.split(/(?<=[.!?])\s+/);
  const out = []; let cur = '';
  for (const s of sentences) {
    if ((cur + ' ' + s).trim().length <= maxChars) cur = (cur + ' ' + s).trim();
    else { if (cur) out.push(cur); cur = s; }
  }
  if (cur) out.push(cur);
  return out;
}

// ---- VOICES ----
let allVoices = [];
function renderVoiceOptions() {
  const showAll = document.getElementById('allLangs').checked;
  const filtered = showAll ? allVoices : allVoices.filter(v => v.lang.toLowerCase().startsWith('en'));
  const list = filtered.length ? filtered : allVoices;
  voiceSelect.innerHTML = '';
  list.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.__idx;
    opt.textContent = `${v.name} (${v.lang})`;
    voiceSelect.appendChild(opt);
  });
  document.getElementById('voiceHint').textContent =
    `${list.length} voice${list.length === 1 ? '' : 's'} available. For better iPhone voices: Settings > Accessibility > Spoken Content > Voices.`;
  const saved = safeStorage(() => localStorage.getItem('audiobook_voice'), null);
  if (saved !== null && list.some(v => String(v.__idx) === saved)) voiceSelect.value = saved;
}
function populateVoices() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  allVoices = voices.map((v, i) => ({ name: v.name, lang: v.lang, __idx: i }));
  renderVoiceOptions();
}
document.getElementById('allLangs').addEventListener('change', renderVoiceOptions);
speechSynthesis.onvoiceschanged = populateVoices;
populateVoices();

rateInput.addEventListener('input', () => {
  rateVal.textContent = parseFloat(rateInput.value).toFixed(1) + 'x';
  safeStorage(() => localStorage.setItem('audiobook_rate', rateInput.value), null);
});
const savedRate = safeStorage(() => localStorage.getItem('audiobook_rate'), null);
if (savedRate) { rateInput.value = savedRate; rateVal.textContent = parseFloat(savedRate).toFixed(1) + 'x'; }
voiceSelect.addEventListener('change', () => {
  safeStorage(() => localStorage.setItem('audiobook_voice', voiceSelect.value), null);
});

// ---- PLAYBACK ----
function showChunk() {
  chunkTextEl.textContent = chunks[idx] || '';
  document.getElementById('nowMeta').textContent = `Chunk ${idx + 1} of ${chunks.length}`;
  const pct = chunks.length ? (idx / (chunks.length - 1 || 1)) * 100 : 0;
  scrub.value = pct;
  scrub.style.setProperty('--pct', pct + '%');
  document.getElementById('scrubPos').textContent = `${idx + 1}`;
  document.getElementById('scrubTotal').textContent = `${chunks.length}`;
  const lib = getLibrary();
  if (lib[currentBookId]) { lib[currentBookId].idx = idx; saveLibrary(lib); }
  updateMediaSession();
}

function updateMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const lib = getLibrary();
  const title = (lib[currentBookId] && lib[currentBookId].title) || 'Narrately';
  navigator.mediaSession.metadata = new MediaMetadata({ title, artist: 'Narrately', album: `Chunk ${idx + 1} of ${chunks.length}` });
  navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
}
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => playBtn.click());
  navigator.mediaSession.setActionHandler('pause', () => playBtn.click());
  navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.click());
  navigator.mediaSession.setActionHandler('nexttrack', () => nextBtn.click());
}

function speakCurrent() {
  if (idx >= chunks.length) { isPlaying = false; playBtn.textContent = '▶'; updateMediaSession(); return; }
  showChunk();
  const utter = new SpeechSynthesisUtterance(chunks[idx]);
  const voices = speechSynthesis.getVoices();
  const v = voices[voiceSelect.value];
  if (v) utter.voice = v;
  utter.rate = parseFloat(rateInput.value);
  utter.onend = () => { if (isPlaying) { idx++; speakCurrent(); } };
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

playBtn.addEventListener('click', () => {
  if (isPlaying) {
    isPlaying = false; speechSynthesis.cancel(); playBtn.textContent = '▶'; updateMediaSession();
  } else {
    isPlaying = true; playBtn.textContent = '⏸'; speakCurrent();
  }
});
stopBtn.addEventListener('click', () => {
  isPlaying = false; speechSynthesis.cancel(); playBtn.textContent = '▶'; updateMediaSession();
});
prevBtn.addEventListener('click', () => {
  isPlaying = false; speechSynthesis.cancel(); playBtn.textContent = '▶';
  idx = Math.max(0, idx - 1); showChunk();
});
nextBtn.addEventListener('click', () => {
  isPlaying = false; speechSynthesis.cancel(); playBtn.textContent = '▶';
  idx = Math.min(chunks.length - 1, idx + 1); showChunk();
});
scrub.addEventListener('change', () => {
  isPlaying = false; speechSynthesis.cancel(); playBtn.textContent = '▶';
  const target = Math.round((scrub.value / 100) * (chunks.length - 1));
  idx = Math.max(0, Math.min(chunks.length - 1, target));
  showChunk();
});

// ---- ADD BOOK ----
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  if (PAYWALL_ENABLED && !isPro() && Object.keys(getLibrary()).length >= FREE_BOOK_LIMIT) {
    statusEl.textContent = `Free plan limit reached (${FREE_BOOK_LIMIT} books).`;
    e.target.value = ''; showPaywall(); return;
  }

  statusEl.textContent = 'Extracting text...';
  try {
    let raw = '';
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'pdf') raw = await extractPdf(file);
    else if (ext === 'docx') raw = await extractDocx(file);
    else raw = await extractTxt(file);

    const text = cleanText(raw);
    const bookChunks = chunkText(text);
    const id = 'b_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    const title = file.name.replace(/\.(pdf|docx|txt)$/i, '');

    const lib = getLibrary();
    lib[id] = { title, chunks: bookChunks, idx: 0, addedAt: Date.now() };
    const ok = saveLibrary(lib);
    e.target.value = '';
    if (!ok) { statusEl.textContent = 'Could not save — storage may be full. Remove an old book first.'; return; }
    statusEl.textContent = `Added "${title}" — ${bookChunks.length} chunks.`;
    renderLibrary();
  } catch (err) {
    statusEl.textContent = 'Error reading file: ' + err.message;
  }
});

renderLibrary();
</script>
</body>
</html>
